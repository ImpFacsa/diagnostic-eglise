<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Diagnostic de croissance de l'Église</title>
<meta name="description" content="Questionnaire anonyme de diagnostic de croissance de l'Église, à la lumière d'Actes 2:42-47.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,650&family=Public+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="style.css">
<link rel="icon" type="image/png" href="favicon.png">
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
    <img src="logo.png" alt="Église adventiste du septième jour" class="logo" width="256" height="256">
    <div class="stack" style="gap:4px">
      <span class="eyebrow">À la lumière d'Actes 2 :42-47</span>
      <h1>Diagnostic de croissance de l'Église</h1>
    </div>
    </div>
  </header>
  <main id="view-form" class="stack"><section class="panel"><p class="muted">Chargement…</p></section></main>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="shared.js"></script>
<script>
const STEPS=12; // 0 communauté, 1-10 sections, 11 questions stratégiques, 12 profil
let COMMS=[];
const empty=()=>({step:0,comm:"",code:"",ans:Array(100).fill(null),open:{},profile:{}});
let draft=store.get("diag-draft")||empty();
const saveDraft=()=>store.set("diag-draft",draft);
const commName=id=>(COMMS.find(c=>c.id===id)||{name:""}).name;
let busy=false;

function renderForm(msg){
  const v=$("#view-form"),s=draft.step;
  if(store.get("diag-done")&&s===0){
    v.innerHTML=`<section class="panel stack"><h2>Merci, votre réponse est enregistrée</h2><p>Que Dieu bénisse votre engagement pour la croissance de votre Église.</p><p class="muted small">Une seule réponse est acceptée par appareil. Si une autre personne utilise cet appareil, elle peut répondre à son tour.</p><div><button class="btn" id="again">Une autre personne veut répondre</button></div></section>`;
    $("#again").onclick=()=>{store.del("diag-done");renderForm()};return}
  const prog=`<div class="stack" style="gap:6px"><div class="row" style="justify-content:space-between"><span class="eyebrow">Étape ${s+1} sur ${STEPS+1}</span><span class="small muted">${esc(commName(draft.comm))}</span></div><div class="progress"><i style="width:${(s/STEPS)*100}%"></i></div></div>`;
  const alert=msg?`<div class="alert" role="alert">${msg}</div>`:"";
  let body="";
  if(s===0){
    body=`<section class="panel stack"><h2>Objectif</h2><p>Ce questionnaire aide votre Église à mieux comprendre sa réalité actuelle et à identifier ses forces, ses besoins et ses priorités de croissance. Il ne s'agit <b>ni d'un examen des membres, ni d'une évaluation individuelle</b>, mais d'un outil pour discerner ensemble la santé de notre communauté.</p><p>Vos réponses sont <b>anonymes</b> : ni votre nom, ni votre adresse e-mail ne sont demandés.</p><p class="muted small">Comptez environ 25 minutes. Vos réponses sont gardées sur cet appareil jusqu'à l'envoi : vous pouvez fermer la page et reprendre plus tard.</p></section>
    <section class="panel stack"><h2>Votre communauté</h2>${alert}<div class="row"><label class="field">Communauté<select id="f-comm"><option value="">Choisir…</option>${COMMS.map(c=>`<option value="${c.id}" ${draft.comm===c.id?"selected":""}>${esc(c.name)}</option>`).join("")}</select></label><label class="field">Code d'accès<input type="text" id="f-code" autocomplete="off" autocapitalize="characters" value="${esc(draft.code)}" placeholder="Remis par votre Église"></label></div><div class="nav"><span></span><button class="btn primary" id="next">Commencer</button></div></section>`;
  } else if(s<=10){
    const d=DIMS[s-1];let rows="";
    for(let i=d.from;i<=d.to;i++){const a=draft.ans[i-1];rows+=`<div class="item" id="it${i}"><p><span class="n">${i}.</span>${esc(ITEMS[i-1])}</p><div class="scale" role="radiogroup" aria-label="Réponse ${i}">${[0,1,2,3,4].map(n=>`<label title="${SCALE[n]}"><input type="radio" name="q${i}" id="q${i}-${n}" value="${n}" ${a===n?"checked":""}><span>${n}</span></label>`).join("")}</div></div>`}
    body=`<section class="panel stack"><div class="stack" style="gap:4px"><span class="eyebrow">Partie ${d.roman}</span><h2>${esc(d.title)}</h2>${d.verse?`<p class="verse">${esc(d.verse)}</p>`:""}</div>${d.intro?`<p class="note">${esc(d.intro)}</p>`:""}
    <div class="legend">${SCALE.map((t,n)=>`<span><b>${n}</b> · ${t}</span>`).join("")}</div>${alert}<div>${rows}</div>
    ${d.open?`<label class="field">${esc(d.open.q)} <span class="muted small" style="font-weight:400">Facultatif</span><textarea id="open-${d.open.k}" data-open="${d.open.k}" maxlength="2000">${esc(draft.open[d.open.k]||"")}</textarea></label>`:""}
    <div class="nav"><button class="btn" id="prev">Précédent</button><button class="btn primary" id="next">Continuer</button></div></section>`;
  } else if(s===11){
    body=`<section class="panel stack"><div class="stack" style="gap:4px"><span class="eyebrow">Partie XI</span><h2>Questions ouvertes stratégiques</h2><p class="muted">Ces questions recueillent ce qu'une note ne peut pas mesurer. Toutes sont facultatives.</p></div>${STRAT.map(([k,t,q])=>`<label class="field">${esc(t)}<span class="muted small" style="font-weight:400">${esc(q)}</span><textarea id="open-${k}" data-open="${k}" maxlength="2000">${esc(draft.open[k]||"")}</textarea></label>`).join("")}<div class="nav"><button class="btn" id="prev">Précédent</button><button class="btn primary" id="next">Continuer</button></div></section>`;
  } else {
    body=`<section class="panel stack"><div class="stack" style="gap:4px"><span class="eyebrow">Partie XII</span><h2>Profil du répondant</h2><p class="muted">Ces informations restent limitées à ce qui est utile à l'étude. Aucun résultat n'est affiché pour un groupe de moins de ${MIN_N} personnes.</p></div>${alert}${PROFILE.map(p=>`<fieldset style="border:0;padding:0;margin:0" class="stack"><legend style="font-weight:600;margin-bottom:8px">${esc(p.q)}</legend><div class="choices">${p.opts.map((o,j)=>`<label><input type="radio" name="p-${p.k}" id="p-${p.k}-${j}" value="${esc(o)}" ${draft.profile[p.k]===o?"checked":""}>${esc(o)}</label>`).join("")}</div></fieldset>`).join("")}<div class="nav"><button class="btn" id="prev">Précédent</button><button class="btn primary" id="next">${busy?"Envoi en cours…":"Envoyer mes réponses"}</button></div></section>`;
  }
  v.innerHTML=prog+body;
  v.querySelectorAll("textarea[data-open]").forEach(t=>t.oninput=()=>{draft.open[t.dataset.open]=t.value;saveDraft()});
  v.querySelectorAll(".scale input").forEach(inp=>inp.onchange=()=>{const i=+inp.name.slice(1);draft.ans[i-1]=+inp.value;$("#it"+i).classList.remove("missing");saveDraft()});
  v.querySelectorAll(".choices input").forEach(inp=>inp.onchange=()=>{draft.profile[inp.name.slice(2)]=inp.value;saveDraft()});
  const prev=$("#prev");if(prev)prev.onclick=()=>{draft.step--;saveDraft();renderForm();window.scrollTo(0,0)};
  $("#next").onclick=next;$("#next").disabled=busy;
}

async function next(){
  if(busy)return;
  const s=draft.step;
  if(s===0){
    const c=$("#f-comm").value,code=$("#f-code").value.trim();
    draft.comm=c;draft.code=code;saveDraft(); // garde la saisie si un message d'erreur s'affiche
    if(!c)return renderForm("Choisissez votre communauté dans la liste.");
    if(!code)return renderForm("Saisissez le code d'accès remis par votre Église.");
    busy=true;$("#next").disabled=true;
    const {data,error}=await sb.rpc("check_code",{p_community:c,p_code:code});busy=false;
    if(error)return renderForm("Connexion impossible. Vérifiez votre accès à Internet et réessayez.");
    if(!data)return renderForm("Ce code ne correspond pas à la communauté choisie. Vérifiez le code remis par votre Église.");
    draft.comm=c;draft.code=code;
  } else if(s<=10){
    const d=DIMS[s-1],miss=[];for(let i=d.from;i<=d.to;i++)if(draft.ans[i-1]===null)miss.push(i);
    if(miss.length){renderForm(`Il reste ${miss.length} affirmation${miss.length>1?"s":""} sans réponse : n° ${miss.join(", ")}.`);miss.forEach(i=>$("#it"+i).classList.add("missing"));$("#it"+miss[0]).scrollIntoView({block:"center"});return}
  } else if(s===12){
    const miss=PROFILE.filter(p=>!draft.profile[p.k]);if(miss.length)return renderForm("Merci de compléter : "+miss.map(p=>p.q.toLowerCase()).join(" ; ")+".");
    const firstMissing=draft.ans.findIndex(a=>a===null);
    if(firstMissing>=0){draft.step=DIMS.findIndex(d=>firstMissing+1>=d.from&&firstMissing+1<=d.to)+1;saveDraft();return renderForm("Une affirmation n'a pas de réponse dans cette partie.")}
    busy=true;renderForm();
    const open=Object.fromEntries(Object.entries(draft.open).filter(([k,v])=>v&&v.trim()));
    const {error}=await sb.rpc("submit_response",{p_community:draft.comm,p_code:draft.code,p_answers:draft.ans,p_open:open,p_profile:draft.profile});
    busy=false;
    if(error){
      if(/CODE_INVALIDE/.test(error.message)){draft.step=0;saveDraft();return renderForm("Le code de votre communauté a changé ou n'est plus actif. Demandez le nouveau code à votre Église, vos réponses sont conservées.")}
      return renderForm("L'envoi n'a pas abouti. Vos réponses sont conservées sur cet appareil : vérifiez votre connexion et appuyez de nouveau sur « Envoyer ».");
    }
    store.set("diag-done",true);draft=empty();store.del("diag-draft");renderForm();window.scrollTo(0,0);return;
  }
  draft.step++;saveDraft();renderForm();window.scrollTo(0,0);
}

(async()=>{
  if(!sb){$("#view-form").innerHTML=CONFIG_MSG;return}
  const {data,error}=await sb.rpc("public_communities");
  if(error){$("#view-form").innerHTML=`<section class="panel stack"><h2>Service momentanément indisponible</h2><p>Le questionnaire n'a pas pu se charger. Réessayez dans quelques minutes.</p></section>`;return}
  COMMS=data||[];
  if(draft.comm&&!COMMS.some(c=>c.id===draft.comm)){draft.comm="";draft.step=0}
  renderForm();
})();
</script>
</body>
</html>
