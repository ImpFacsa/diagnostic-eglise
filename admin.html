<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Administration – Diagnostic de croissance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,650&family=Public+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="style.css">
<link rel="icon" type="image/png" href="favicon.png">
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
    <img src="logo.png" alt="Église adventiste du septième jour" class="logo" width="256" height="256">
    <div class="stack" style="gap:4px">
      <span class="eyebrow">Administration</span>
      <h1>Diagnostic de croissance de l'Église</h1>
    </div>
    </div>
    <div class="row" id="userbox"></div>
  </header>
  <main id="view-admin" class="stack"><section class="panel"><p class="muted">Chargement…</p></section></main>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="shared.js"></script>
<script>
let COMMS=[],DATA=[],loaded=false;
let admin={comms:null,year:"",age:"",anc:"",resp:"",min:"",mode:"resp",gapBy:"age",openK:"s1"};
const commName=id=>(COMMS.find(c=>c.id===id)||{name:"?"}).name;
const V=()=>$("#view-admin");

// ---------- Connexion ----------
function renderLogin(err){
  $("#userbox").innerHTML="";
  V().innerHTML=`<section class="panel stack" style="max-width:420px"><h2>Connexion administrateur</h2>${err?`<div class="alert" role="alert">${esc(err)}</div>`:""}
  <form id="loginf" class="stack"><label class="field">Adresse e-mail<input type="text" id="em" inputmode="email" autocomplete="username"></label><label class="field">Mot de passe<input type="password" id="pw" autocomplete="current-password"></label><div><button class="btn primary" id="login">Se connecter</button></div></form></section>`;
  $("#loginf").onsubmit=async e=>{e.preventDefault();$("#login").disabled=true;
    const {error}=await sb.auth.signInWithPassword({email:$("#em").value.trim(),password:$("#pw").value});
    if(error)return renderLogin("Adresse e-mail ou mot de passe incorrect.");
    start();};
}
async function start(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session)return renderLogin();
  $("#userbox").innerHTML=`<span class="small muted">${esc(session.user.email)}</span><button class="btn" id="reload">Actualiser</button><button class="btn" id="logout">Se déconnecter</button>`;
  $("#logout").onclick=async()=>{await sb.auth.signOut();loaded=false;renderLogin()};
  $("#reload").onclick=()=>load();
  const {data:isAdm}=await sb.rpc("is_admin");
  if(!isAdm){V().innerHTML=`<section class="panel stack"><h2>Accès non autorisé</h2><p>Ce compte n'est pas encore déclaré administrateur. Suivez l'étape « Créer un administrateur » du guide d'installation.</p></section>`;return}
  load();
}

// ---------- Chargement des données ----------
async function load(){
  V().innerHTML=`<section class="panel"><p class="muted">Chargement des réponses…</p></section>`;
  const c=await sb.from("communities").select("id,name,code,active,created_at").order("name");
  if(c.error)return V().innerHTML=`<section class="panel"><div class="alert">Chargement impossible : ${esc(c.error.message)}</div></section>`;
  let all=[],from=0;
  while(true){
    const r=await sb.from("responses").select("community_id,created_at,answers,open,profile").order("created_at").range(from,from+999);
    if(r.error)return V().innerHTML=`<section class="panel"><div class="alert">Chargement impossible : ${esc(r.error.message)}</div></section>`;
    all=all.concat(r.data);if(r.data.length<1000)break;from+=1000;
  }
  COMMS=c.data;
  DATA=all.map(r=>({comm:r.community_id,date:r.created_at.slice(0,10),ans:r.answers,open:r.open||{},profile:r.profile||{},dim:scoreDims(r.answers)}));
  if(!admin.comms)admin.comms=new Set(COMMS.map(x=>x.id));
  else COMMS.forEach(x=>{if(!loaded)admin.comms.add(x.id)});
  loaded=true;renderAdmin();
}

// ---------- Tableau de bord ----------
function renderAdmin(){
  const v=V();
  const years=[...new Set(DATA.map(r=>r.date.slice(0,4)))].sort().reverse();
  const inPeriod=r=>!admin.year||r.date.startsWith(admin.year);
  const F=DATA.filter(r=>inPeriod(r)&&admin.comms.has(r.comm)&&(!admin.age||r.profile.age===admin.age)&&(!admin.anc||r.profile.anc===admin.anc)&&(!admin.resp||r.profile.resp===admin.resp)&&(!admin.min||r.profile.min===admin.min));
  const selC=COMMS.filter(c=>admin.comms.has(c.id));
  const countC=id=>DATA.filter(r=>r.comm===id&&inPeriod(r)).length;
  const sel=(id,label,opts,val,all="Tous")=>`<label class="field" style="flex:1 1 150px">${label}<select id="${id}"><option value="">${all}</option>${opts.map(o=>`<option ${val===o?"selected":""}>${esc(o)}</option>`).join("")}</select></label>`;
  const filters=`<section class="panel filters"><div class="row" style="justify-content:space-between"><h2>Analyse</h2><span class="small muted">${DATA.length} réponse${DATA.length>1?"s":""} au total</span></div>
   <div class="stack" style="gap:8px"><span class="eyebrow">Communautés</span><div class="row" style="gap:6px"><button class="chip" id="c-all" aria-pressed="${selC.length===COMMS.length}">Toutes</button>${COMMS.map(c=>`<button class="chip" data-c="${c.id}" aria-pressed="${admin.comms.has(c.id)}">${esc(c.name)}<small>${countC(c.id)}</small></button>`).join("")}</div></div>
   <div class="row">${sel("f-year","Année",years,admin.year,"Toutes")}${sel("f-age","Âge",PROFILE[0].opts,admin.age)}${sel("f-anc","Ancienneté",PROFILE[1].opts,admin.anc)}${sel("f-resp","Responsable",["Oui","Non"],admin.resp)}${sel("f-min","Dans un ministère",["Oui","Non"],admin.min)}</div>
   ${selC.length>1?`<div class="row small"><span class="muted">Calcul de l'ensemble :</span><label class="row" style="gap:6px"><input type="radio" name="mode" id="m-resp" value="resp" ${admin.mode==="resp"?"checked":""}> chaque répondant compte pareil</label><label class="row" style="gap:6px"><input type="radio" name="mode" id="m-comm" value="comm" ${admin.mode==="comm"?"checked":""}> chaque communauté compte pareil</label></div>`:""}</section>`;

  let results="";
  if(F.length<MIN_N){results=`<section class="panel"><p><b>${F.length} répondant${F.length>1?"s":""}</b> pour cette sélection.</p><p class="muted">Les résultats ne s'affichent qu'à partir de ${MIN_N} répondants, pour protéger l'anonymat. Élargissez la sélection ou attendez d'autres réponses.</p></section>`}
  else{
    const byComm={};F.forEach(r=>(byComm[r.comm]=byComm[r.comm]||[]).push(r));
    const dimMean=k=>admin.mode==="comm"&&selC.length>1?mean(Object.values(byComm).map(a=>mean(a.map(r=>r.dim[k])))):mean(F.map(r=>r.dim[k]));
    const D=DIMS.map(d=>{const vals=F.map(r=>r.dim[d.k]);return{...d,m:dimMean(d.k),p25:pct(vals,.25),p75:pct(vals,.75)}});
    const glob=mean(D.map(d=>d.m));const sorted=[...D].sort((a,b)=>b.m-a.m);
    const stats=`<div class="stats"><div class="stat"><span class="eyebrow">Répondants</span><b>${F.length}</b><span class="small muted">${Object.keys(byComm).length} communauté${Object.keys(byComm).length>1?"s":""}</span></div><div class="stat"><span class="eyebrow">Score global</span><b>${glob.toFixed(0)} %</b><span class="pill ${status(glob)[0]}">${status(glob)[1]}</span></div><div class="stat"><span class="eyebrow">Point fort</span><b style="font-size:1.1rem;padding-block:6px">${esc(sorted[0].name)}</b><span class="small muted">${sorted[0].m.toFixed(0)} %</span></div><div class="stat"><span class="eyebrow">À prioriser</span><b style="font-size:1.1rem;padding-block:6px">${esc(sorted[9].name)}</b><span class="small muted">${sorted[9].m.toFixed(0)} %</span></div></div>`;
    const chart=`<section class="panel stack"><div class="stack" style="gap:4px"><h2>Les dix dimensions</h2><p class="small muted">Le point indique la moyenne. La bande claire montre où se situe la moitié centrale des répondants : plus elle est large, plus les avis sont partagés.</p></div><div>
     ${D.map(d=>{const[c,l]=status(d.m);return`<div class="dimrow"><span class="lab">${d.roman}. ${esc(d.name)}</span><div class="track"><span class="th" style="left:50%"></span><span class="th" style="left:75%"></span><span class="band" style="left:${d.p25}%;width:${Math.max(1,d.p75-d.p25)}%"></span><span class="bar" style="width:${d.m}%"></span><span class="dot" style="left:${d.m}%"></span></div><span class="val">${d.m.toFixed(0)} %</span><span class="pill ${c}">${l}</span></div>`}).join("")}
     <div class="axis"><div></div><div class="ticks">${[0,25,50,75,100].map(t=>`<span style="left:${t}%">${t}</span>`).join("")}</div><div></div><div></div></div></div>
     <p class="small muted">Seuils : 75 % et plus = force, 50 à 74 % = à consolider, moins de 50 % = prioritaire.</p></section>`;
    const cell=(arr,k)=>{if(arr.length<MIN_N)return`<td class="num na">n&lt;${MIN_N}</td>`;const m=mean(arr.map(r=>r.dim[k]));return`<td class="num ${status(m)[0]}">${m.toFixed(0)}</td>`};
    const heat=selC.length>1?`<section class="panel stack"><h2>Comparaison des communautés</h2><div class="tablewrap"><table><thead><tr><th>Dimension</th>${selC.map(c=>`<th>${esc(c.name)}<br><span style="text-transform:none;letter-spacing:0">${(byComm[c.id]||[]).length} rép.</span></th>`).join("")}<th>Ensemble</th></tr></thead><tbody>${D.map(d=>`<tr><td>${d.roman}. ${esc(d.name)}</td>${selC.map(c=>cell(byComm[c.id]||[],d.k)).join("")}<td class="num ${status(d.m)[0]}">${d.m.toFixed(0)}</td></tr>`).join("")}</tbody></table></div><p class="small muted">Scores en %. Une communauté de moins de ${MIN_N} répondants n'est pas affichée séparément, mais compte dans l'ensemble.</p></section>`:"";
    const gp=PROFILE.find(p=>p.k===admin.gapBy);const groups=gp.opts.map(o=>({o,arr:F.filter(r=>r.profile[gp.k]===o)}));
    const gaps=`<section class="panel stack"><div class="row" style="justify-content:space-between"><div class="stack" style="gap:4px"><h2>Écarts entre profils</h2><p class="small muted">Repérez les décalages entre ce que vivent les différents groupes.</p></div><label class="field" style="flex:0 1 240px">Comparer selon<select id="gapby">${PROFILE.slice(0,4).map(p=>`<option value="${p.k}" ${p.k===admin.gapBy?"selected":""}>${esc(p.q.replace(/ \?$/,""))}</option>`).join("")}</select></label></div><div class="tablewrap"><table><thead><tr><th>Dimension</th>${groups.map(g=>`<th>${esc(g.o)}<br><span style="text-transform:none;letter-spacing:0">${g.arr.length} rép.</span></th>`).join("")}<th>Écart max</th></tr></thead><tbody>${D.map(d=>{const ms=groups.filter(g=>g.arr.length>=MIN_N).map(g=>mean(g.arr.map(r=>r.dim[d.k])));const gap=ms.length>1?Math.max(...ms)-Math.min(...ms):null;return`<tr><td>${d.roman}. ${esc(d.name)}</td>${groups.map(g=>cell(g.arr,d.k)).join("")}<td class="num ${gap===null?"na":gap>=15?"bad":gap>=8?"warn":""}">${gap===null?"—":gap.toFixed(0)+" pts"}</td></tr>`}).join("")}</tbody></table></div><p class="small muted">Un écart de 15 points ou plus est signalé en rouge, de 8 à 14 points en orange.</p></section>`;
    const im=ITEMS.map((t,i)=>({n:i+1,t,m:mean(F.map(r=>r.ans[i]))}));const bySc=[...im].sort((a,b)=>b.m-a.m);
    const li=a=>a.map(x=>`<li><b>${x.m.toFixed(1)}</b><span><span class="muted">n° ${x.n} · </span>${esc(x.t)}</span></li>`).join("");
    const items=`<div class="cols2"><section class="panel stack"><h3>Les 5 affirmations les mieux vécues</h3><ol class="items">${li(bySc.slice(0,5))}</ol></section><section class="panel stack"><h3>Les 5 affirmations les plus faibles</h3><ol class="items">${li(bySc.slice(-5).reverse())}</ol></section></div><p class="small muted" style="margin-top:-6px">Moyenne sur 4.</p>`;
    const oq=OPENQ.find(o=>o.k===admin.openK);const ans=F.filter(r=>r.open[oq.k]);
    const opens=`<section class="panel stack"><div class="row" style="justify-content:space-between"><h2>Réponses ouvertes</h2><label class="field" style="flex:0 1 320px">Question<select id="openq">${OPENQ.map(o=>`<option value="${o.k}" ${o.k===admin.openK?"selected":""}>${esc(o.label)}</option>`).join("")}</select></label></div><p class="verse">${esc(oq.q)}</p><p class="small muted">${ans.length} réponse${ans.length>1?"s":""}</p><div class="answers">${ans.map(r=>`<div class="answer">${esc(r.open[oq.k])}<div class="meta">${esc(commName(r.comm))} · ${esc(r.profile.age)}</div></div>`).join("")||`<p class="muted">Aucune réponse pour cette sélection.</p>`}</div></section>`;
    results=stats+chart+heat+gaps+items+opens;
  }

  const manage=`<section class="panel stack"><h2>Communautés</h2><div class="tablewrap"><table><thead><tr><th>Communauté</th><th>Code d'accès</th><th>Réponses</th><th>Questionnaire</th></tr></thead><tbody>${COMMS.map(c=>`<tr><td>${esc(c.name)}</td><td><code>${esc(c.code)}</code> <button class="btn small" style="padding:3px 8px" data-code="${c.id}">Changer</button></td><td class="num">${DATA.filter(r=>r.comm===c.id).length}</td><td><button class="btn small" style="padding:3px 10px" data-act="${c.id}">${c.active?"Ouvert · fermer":"Fermé · rouvrir"}</button></td></tr>`).join("")}</tbody></table></div>
   <div class="row" style="align-items:flex-end"><label class="field">Nouvelle communauté<input type="text" id="nc-name" placeholder="Nom de l'Église"></label><label class="field" style="flex:0 1 160px">Code<input type="text" id="nc-code" placeholder="EX. BOURG" autocapitalize="characters"></label><button class="btn" id="nc-add">Ajouter</button></div><div id="nc-msg"></div>
   <p class="small muted">Fermer une communauté la retire de la liste du questionnaire, sans effacer ses réponses.</p></section>
   <section class="panel stack"><h2>Export</h2><div class="row"><button class="btn primary" id="csv">Télécharger la sélection (CSV)</button><span class="small muted">S'ouvre dans Excel ou Google Sheets. Contient ${F.length} réponse${F.length>1?"s":""}.</span></div></section>`;
  v.innerHTML=filters+results+manage;

  // événements
  $("#c-all").onclick=()=>{admin.comms=new Set(COMMS.map(c=>c.id));renderAdmin()};
  v.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{const id=b.dataset.c;if(admin.comms.size===COMMS.length)admin.comms=new Set([id]);else if(admin.comms.has(id)){admin.comms.delete(id);if(!admin.comms.size)admin.comms=new Set(COMMS.map(c=>c.id))}else admin.comms.add(id);renderAdmin()});
  [["f-year","year"],["f-age","age"],["f-anc","anc"],["f-resp","resp"],["f-min","min"]].forEach(([id,k])=>$("#"+id).onchange=e=>{admin[k]=e.target.value;renderAdmin()});
  v.querySelectorAll("input[name=mode]").forEach(i=>i.onchange=()=>{admin.mode=i.value;renderAdmin()});
  const g=$("#gapby");if(g)g.onchange=e=>{admin.gapBy=e.target.value;renderAdmin()};
  const o=$("#openq");if(o)o.onchange=e=>{admin.openK=e.target.value;renderAdmin()};
  const msg=(t,ok)=>$("#nc-msg").innerHTML=`<div class="${ok?"note":"alert"}">${esc(t)}</div>`;
  const codeOk=c=>/^[A-Z0-9-]{3,30}$/.test(c);
  $("#nc-add").onclick=async()=>{const n=$("#nc-name").value.trim(),c=$("#nc-code").value.trim().toUpperCase();
    if(n.length<2||!codeOk(c))return msg("Indiquez un nom et un code de 3 à 30 caractères (lettres, chiffres ou tiret).");
    const {data,error}=await sb.from("communities").insert({name:n,code:c}).select("id").single();
    if(error)return msg(error.code==="23505"?"Ce code est déjà utilisé par une autre communauté.":"Ajout impossible : "+error.message);
    admin.comms.add(data.id);await load();msg(`« ${n} » est ajoutée. Code à communiquer : ${c}`,true)};
  v.querySelectorAll("[data-act]").forEach(b=>b.onclick=async()=>{const c=COMMS.find(x=>x.id===b.dataset.act);
    const {error}=await sb.from("communities").update({active:!c.active}).eq("id",c.id);if(error)return msg("Modification impossible : "+error.message);load()});
  v.querySelectorAll("[data-code]").forEach(b=>b.onclick=()=>{const c=COMMS.find(x=>x.id===b.dataset.code);const td=b.parentElement;
    td.innerHTML=`<span class="row" style="gap:6px"><input type="text" id="ec-${c.id}" value="${esc(c.code)}" style="width:130px;padding:4px 8px"><button class="btn small" style="padding:3px 8px" id="es-${c.id}">OK</button></span>`;
    $("#es-"+c.id).onclick=async()=>{const nc=$("#ec-"+c.id).value.trim().toUpperCase();if(!codeOk(nc))return msg("Le code doit faire 3 à 30 caractères (lettres, chiffres ou tiret).");
      const {error}=await sb.from("communities").update({code:nc}).eq("id",c.id);if(error)return msg(error.code==="23505"?"Ce code est déjà utilisé.":"Modification impossible : "+error.message);load()}});
  $("#csv").onclick=()=>{
    const head=["communaute","date","age","anciennete","responsable","ministere","ecole_sabbat","culte",...ITEMS.map((_,i)=>"q"+(i+1)),...DIMS.map(d=>d.k+"_pct"),...OPENQ.map(o=>o.k)];
    const q=s=>`"${String(s??"").replace(/"/g,'""')}"`;
    const rows=F.map(r=>[commName(r.comm),r.date,r.profile.age,r.profile.anc,r.profile.resp,r.profile.min,r.profile.es,r.profile.culte,...r.ans,...DIMS.map(d=>r.dim[d.k].toFixed(1).replace(".",",")),...OPENQ.map(o=>r.open[o.k]||"")].map(q).join(";"));
    const blob=new Blob(["﻿"+[head.join(";"),...rows].join("\r\n")],{type:"text/csv;charset=utf-8"});
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`diagnostic-croissance-${new Date().toISOString().slice(0,10)}.csv`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
}

if(!sb)V().innerHTML=CONFIG_MSG; else start();
</script>
</body>
</html>
